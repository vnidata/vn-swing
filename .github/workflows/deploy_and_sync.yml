name: Deploy Dashboard & Realtime 5M Sync

on:
  # Chạy định kỳ 5 phút một lần trong giờ giao dịch HOSE (09:00 - 15:00 giờ Việt Nam, Thứ 2 - Thứ 6)
  # 02:00 - 08:00 UTC = 09:00 - 15:00 UTC+7
  schedule:
    - cron: '*/5 2-8 * * 1-5'

  # Cho phép kích hoạt thủ công bất kỳ lúc nào từ GitHub UI
  workflow_dispatch:

  # Tự động kích hoạt khi có thay đổi code đẩy lên nhánh main/master
  push:
    branches:
      - main
      - master
    paths:
      - 'web/**'
      - 'src/**'
      - 'configs/**'
      - '.github/workflows/**'

# Cấp quyền ghi code và xuất bản GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Web Realtime Sync (5M Data & Signal Generator)
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: |
          python src/vnswing/ops/web_sync.py

      - name: Commit updated signals to repo
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/signals.json
          git diff --staged --quiet || (git commit -m "chore(sync): update realtime market signals [skip ci]" && git pull --rebase origin main && git push || true)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-sync
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
